appId: app.flownote.desktop
productName: FlowNote
executableName: FlowNote
extraMetadata:
  name: flownote
  productName: FlowNote
npmRebuild: false
afterPack: scripts/flip-fuses.cjs
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - "!out/THIRD_PARTY_NOTICES.txt"
  - package.json
  - "!**/capture-native/{target,src}{,/**}"
  - "!**/capture-native/{Cargo.*,build.rs,rustfmt.toml,*.md}"
extraFiles:
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
extraResources:
  - from: resources
    to: .
fileAssociations:
  - ext: flownote
    name: FlowNote guide
    description: FlowNote guide
    role: Editor
    mimeType: application/x-flownote
mac:
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: FlowNote listens while you narrate a recording, when you turn narration on.
    NSAudioCaptureUsageDescription: FlowNote records the audio of the meeting window you choose, so it can transcribe what was said.
win:
  target:
    - nsis
nsis:
  artifactName: ${productName}-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
linux:
  executableName: flownote
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: linux/icon512.png
  extraResources:
    - from: linux/apparmor-profile
      to: apparmor-profile
  target:
    - AppImage
    - deb
    - rpm
deb:
  afterInstall: linux/after-install.tpl
  afterRemove: linux/after-remove.tpl
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - libxt6
    - libxrandr2
    - libasound2
    - libdbus-1-3
    - libgbm1
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - x11-utils
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - (libXt or libXt6)
    - (libXrandr or libXrandr2)
    - (alsa-lib or libasound2)
    - (mesa-libgbm or libgbm1)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - xprop
    - xwininfo
